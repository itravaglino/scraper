name: Scrape y dashboard Fitbit

# 08:00 America/Buenos_Aires = 11:00 UTC (Argentina stays on UTC-3).
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Ventana de scrape en días (1=día, 7=semana, 30=mes, 90=trimestre). Default 90."
        required: false
        default: "90"
        type: string
  pull_request:
  push:
    branches: [main]
    # Bot commits of scrape output should not start a second scrape.
    paths-ignore:
      - "data/**"
      - "site/**"

concurrency:
  group: fitbit-dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      pages_ready: ${{ steps.setup-pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Scrape público
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SCRAPE_WINDOW_DAYS: ${{ github.event.inputs.window_days || '90' }}
        run: python3 run.py -v

      - name: Rebuild site from committed data
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python3 run.py --skip-fetch

      - name: Commit data and site
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "datos: scrape diario Fitbit $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          delay=4
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "::warning::rebase conflict on attempt ${attempt}; keeping scrape output"
              git checkout --theirs -- data site || true
              git add data site
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "::warning::rebase aborted on attempt ${attempt}; retry in ${delay}s"
                sleep "$delay"
                delay=$((delay * 2))
                continue
              fi
            fi
            if git push origin HEAD:main; then
              echo "Pushed scrape data on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::push rejected on attempt ${attempt} (main moved); retry in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "::warning::Could not push after retries; Pages will still deploy this job's site/"
          exit 0

      - name: Setup Pages
        id: setup-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run when the token is allowed to.
          # GITHUB_TOKEN cannot create a Pages site (GitHub restriction); a PAT
          # in secrets.PAGES_TOKEN with repo scope can, or enable Pages once in
          # Settings → Pages → Source: GitHub Actions.
          enablement: true
          token: ${{ secrets.PAGES_TOKEN != '' && secrets.PAGES_TOKEN || github.token }}

      - name: Upload site
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.setup-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pages not enabled yet
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.setup-pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled. GITHUB_TOKEN cannot create it."
          echo "One click: https://github.com/${{ github.repository }}/settings/pages → Source: GitHub Actions"
          echo "Then re-run this workflow. A static snapshot is already on the gh-pages branch."

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
